name: flutter_screwdriver
description: A flutter package aiming to provide useful extensions and helper functions to ease and speed up development.
version: 4.0.0
homepage: https://github.com/birjuvachhani/flutter_screwdriver

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ">=1.0.0 <2.0.0"
  cupertino_ui: ">=1.0.0 <2.0.0"
  animations: ">=3.0.0 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  analyzer: ^14.1.0
  intl: ^0.20.3
  mockito: ^5.8.1
  args: ^2.7.0
scripts: scripts.yaml